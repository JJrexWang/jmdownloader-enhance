name: docker

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/http-server
    tags:
      - "v*"

# 避免新 push 取消上一次还在跑的 build
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from tauri.conf.json
        id: version
        run: |
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      # GHCR 登录：默认 GITHUB_TOKEN 就有 packages: write 权限
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GitHub Actions 内置 cache 后端，免配 redis
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # 解析 image metadata：自动产生多个 tag
      #   - tag  push:    <version>
      #   - main push:    latest
      #   - 分支 push:    <分支名 sanitize>
      #   - 任意 push:    <sha 前 7 位>
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version }},enable={{is_default_branch}}
            type=ref,event=branch,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # 单架构先稳：arm64 用 QEMU 仿真极慢（>8 分钟 build + cache 协调
          # 容易把 COPY 阶段卡掉）；后续稳定后单独跑 arm64 job 再合并 manifest。
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          provenance: false

      # 把新 cache 拷回原路径，下次 step 直接命中
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      # GHCR user-owned 包默认 private,需要 PATCH 改 public 才能匿名 pull。
      # 包 owner 不一定是 github.repository_owner(GITHUB_TOKEN 是 bot),所以先
      # 探测四个常见 namespace,把第一个 200 的拿来 PATCH。
      - name: Set GHCR package visibility to public
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG_OWNER: ${{ github.repository_owner }}
          PKG_NAME: ${{ github.event.repository.name }}
        run: |
          # 探测这几种 owner namespace 找出包实际归属
          CANDIDATES=(
            "users/$PKG_OWNER"
            "users/$(echo $PKG_OWNER | tr '[:upper:]' '[:lower:]')"
            "orgs/$PKG_OWNER"
            "user"           # 认证用户本身 = workflow bot 的 user namespace
          )

          FOUND=""
          for ns in "${CANDIDATES[@]}"; do
            HTTP=$(curl -s -o /tmp/probe.json -w "%{http_code}" \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/$ns/packages/container/$PKG_NAME")
            echo "probe $ns: HTTP $HTTP"
            if [ "$HTTP" = "200" ]; then
              FOUND="$ns"
              echo "FOUND at $ns"
              cat /tmp/probe.json | python3 -c "import sys,json; d=json.load(sys.stdin); print('  visibility:', d.get('visibility','?')); print('  owner:', d.get('owner',{}).get('login','?'))"
              break
            fi
          done

          if [ -z "$FOUND" ]; then
            echo "package not found in any namespace, skipping PATCH"
            exit 0  # 不让 workflow 失败
          fi

          # 检查当前 visibility,只有 private 才需要 PATCH
          CURRENT_VIS=$(cat /tmp/probe.json | python3 -c "import sys,json; print(json.load(sys.stdin).get('visibility',''))")
          echo "current visibility: $CURRENT_VIS"

          if [ "$CURRENT_VIS" = "public" ]; then
            echo "already public, no PATCH needed"
          else
            # PATCH 设 public(只设 visibility,不写 private 字段,GitHub API schema 不接受)
            HTTP=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X PATCH \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/$FOUND/packages/container/$PKG_NAME" \
              -d '{"visibility":"public"}')
            echo "PATCH result: HTTP $HTTP"
            cat /tmp/resp.json | head -c 400
            echo
          fi

          # 不管 PATCH 成功与否,做一次匿名 pull 探活
          echo "--- anonymous pull probe ---"
          sleep 3
          OWNER_LC=$(echo $PKG_OWNER | tr '[:upper:]' '[:lower:]')
          ANON=$(curl -s "https://ghcr.io/token?service=ghcr.io&scope=repository:$OWNER_LC/$PKG_NAME:pull")
          T=$(echo "$ANON" | python3 -c "import sys,json; print(json.load(sys.stdin).get('token',''))")
          if [ -n "$T" ]; then
            LIST=$(curl -s -H "Authorization: Bearer $T" "https://ghcr.io/v2/$OWNER_LC/$PKG_NAME/tags/list")
            echo "anonymous tags/list: $LIST"
          else
            echo "anonymous pull still denied: $ANON"
          fi
