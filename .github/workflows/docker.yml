name: docker

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/http-server
    tags:
      - "v*"

# 避免新 push 取消上一次还在跑的 build
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from tauri.conf.json
        id: version
        run: |
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      # GHCR 登录：默认 GITHUB_TOKEN 就有 packages: write 权限
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GitHub Actions 内置 cache 后端，免配 redis
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # 解析 image metadata：自动产生多个 tag
      #   - tag  push:    <version>
      #   - main push:    latest
      #   - 分支 push:    <分支名 sanitize>
      #   - 任意 push:    <sha 前 7 位>
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version }},enable={{is_default_branch}}
            type=ref,event=branch,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # 单架构先稳：arm64 用 QEMU 仿真极慢（>8 分钟 build + cache 协调
          # 容易把 COPY 阶段卡掉）；后续稳定后单独跑 arm64 job 再合并 manifest。
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          provenance: false

      # 把新 cache 拷回原路径，下次 step 直接命中
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      # GHCR user-owned 包默认 private,需要手动 PATCH 改 public
      # 才能让 docker compose pull / docker run 直接拉。
      # 用 GitHub API: PATCH /user/packages/{package_type}/{package_name}
      - name: Set GHCR package visibility to public
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG_NAME: jmcomic-downloader-enhance
        run: |
          # 包名在 user namespace 下是 lowercase 的 repo 名
          # 第一次 push 时包可能还不存在(API 异步),加 -L 跟随 + 失败重试
          for i in 1 2 3 4 5; do
            HTTP=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X PATCH \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/user/packages/container/$PKG_NAME \
              -d '{"visibility":"public","private":false}')
            if [ "$HTTP" = "200" ]; then
              echo "package set to public"
              break
            fi
            echo "attempt $i: HTTP $HTTP, retrying..."
            sleep 5
          done
          cat /tmp/resp.json | head -c 200
          echo
