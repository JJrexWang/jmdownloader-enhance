# JMComic Downloader HTTP server —— 单机 docker compose 部署
#
# 用法：
#   docker compose pull             # 拉新镜像（可选）
#   docker compose up -d            # 后台启动
#   docker compose logs -f          # 看日志（stdout + 文件日志也在 /config/logs 下）
#   curl localhost:8080/health      # 验证
#
# 镜像地址：ghcr.io/jjrexwang/jmdownloader-enhance:<tag>
#   当前默认 tag = feat-http-server（feat/http-server 分支最新）
#   后续 main 合并后会多：latest + <tauri 版本号>
#
# 改默认端口 / JM 账号密码：编辑下面 environment 块。
# 改下载根目录：把 ./downloads 改成别的宿主路径；或在容器启动后改
#   /config/config.json 里的 downloadDir。
#
# 关于挂载卷属主：容器内 entrypoint (docker-entrypoint.sh) 会以 root 跑起来，
# 启动时 probe 一下能不能 chown 到 10001:10001:
#   - 能 (普通 Docker / 真 root):chown -R 10001:10001 + gosu 降权跑 server
#   - 不能 (rootless Docker / Podman,容器内 root 是 fake root):
#     chmod -R a+rwX /config /downloads + 直接以 root 跑 server
# 两种模式都让 server 能写挂载卷,任意环境不再因 EACCES 挂掉。
# 所以宿主机 ./config 是不是 root:root 都无所谓,不用手动 chown,
# 也不用再写 user: "0:0"。

services:
  jmcomic-downloader:
    image: ghcr.io/jjrexwang/jmdownloader-enhance:feat-http-server
    container_name: jmcomic-downloader
    restart: unless-stopped

    ports:
      - "8080:8080"   # 改 "0.0.0.0:9000:8080" 可换宿主端口

    volumes:
      # 持久化配置、cookies、日志
      - ./config:/config
      # 漫画下载根目录（容器里 Config.downloadDir 也建议改到这里）
      - ./downloads:/downloads

    environment:
      # 监听端口（容器内；改宿主机侧用上面的 ports）
      JM_PORT: "8080"
      # 想启动时自动登录就填进去；不填也不影响，后续用 POST /login 也能登
      JM_USERNAME: ""
      JM_PASSWORD: ""
      # 日志级别：error / warn / info / debug / trace
      RUST_LOG: "info"

    # 不设 user,让镜像里 ENTRYPOINT 的 docker-entrypoint.sh 以 root 跑,
    # 自适应 chown 降权 / chmod 走 root 两条路径,内部再 exec server。
    # 容器内业务进程优先非 root(普通 Docker);rootless 场景下会退化到 root。

    healthcheck:
      # 等容器起来后用 /health 探活
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
